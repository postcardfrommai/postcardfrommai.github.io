<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postcards from Mai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap">
<style>
/* VOICE: cozy, unhurried, a little handwritten — a public notebook, not a blog
   IDEA: paper keepsakes — postcards for cafés, ticket stubs for films, polaroids and negatives for photos
   PICTURE: the keepsakes themselves, tilted slightly, on warm paper
   COLOUR and TYPE: cream paper, espresso ink, wine for tickets; Instrument Serif + Inter + Caveat notes (Mai's chosen look)
   LAYOUT: one 1080px column, cards in auto-fit grids, everything stacks on a phone */
:root{color-scheme:light;--paper:#F4EFE6;--card:#FBF8F2;--sand:#EAE1D3;--blush:#E8D5CC;--line:#CFC5B6;--ink:#2A2420;--soft:#5C5249;--brown:#7A4E3A;--wine:#7E3434;--wine2:#733030;--gold:#E2B86A}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{max-width:1080px;margin:0 auto;padding:28px max(4vw,16px) 64px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.it{font-style:italic}
.hand{font-family:Caveat,cursive}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);font-weight:600}
.muted{color:var(--soft)}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{font:italic 30px/1 'Instrument Serif',serif}
nav.menu{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px}
nav.menu a{padding:10px 0}
nav.menu a[aria-current]{color:var(--brown);text-decoration:underline;text-underline-offset:6px}
.hero{text-align:center;padding:64px 0 40px}
.hero .hand{font-size:26px;color:var(--brown)}
h1{margin:6px 0 14px;font:400 clamp(48px,9vw,100px)/.95 'Instrument Serif',serif;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0 0 14px;font:400 34px/1.1 'Instrument Serif',serif}
.lead{margin:0 auto;max-width:520px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding-bottom:36px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;padding:7px 14px;border-radius:999px;background:var(--blush);font-size:13px;margin:0 6px 6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:28px;align-items:start}
.back{display:inline-block;margin:24px 0 4px;font-size:14px;color:var(--soft);padding:8px 0}
.stars{color:var(--brown);letter-spacing:3px}.off{color:var(--line)}
.empty{padding:56px 24px;text-align:center;border:1.5px dashed var(--line);border-radius:20px;color:var(--soft)}
.empty .hand{font-size:28px;color:var(--brown)}
/* book */
.cover{background:var(--tone,#A9B59A);border-radius:4px;box-shadow:0 18px 30px rgba(42,36,32,.18);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;aspect-ratio:2/3}
.cover:has(img){padding:0}
.cover span{font:400 22px/1.05 'Instrument Serif',serif}
.bookcard{display:flex;gap:18px;background:var(--card);border:1px solid #E2D9CA;border-radius:16px;padding:22px}
.bookcard .cover{flex:0 0 96px;padding:10px}.bookcard .cover span{font-size:14px}
.card-title{margin:8px 0 6px;font:400 28px/1.05 'Instrument Serif',serif}
.feature{display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding:clamp(24px,4vw,40px);background:var(--sand);border-radius:20px;margin-bottom:32px}
.feature .cover{flex:0 0 190px}
.feature>div:last-child{flex:1 1 320px}
/* postcard */
.postcard{display:block;background:var(--card);padding:12px;border-radius:4px;box-shadow:0 16px 28px rgba(42,36,32,.14)}
.postcard .front{position:relative;aspect-ratio:4/3;background:#C9B29B;overflow:hidden}
.postcard .greet{position:absolute;left:12px;right:80px;bottom:10px;font:italic 24px/1.05 'Instrument Serif',serif;color:#FBF8F2;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.stamp{position:absolute;top:10px;right:10px;padding:4px;background:var(--card);border:2px dashed #B7A893}
.stamp div{background:var(--brown);color:#FBF8F2;width:56px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 24px/1 'Instrument Serif',serif}
.stamp small{font:500 9px Inter,sans-serif;letter-spacing:.1em;margin-top:4px}
.postcard p{margin:8px 0 0;font:500 22px/1.25 Caveat,cursive}
.bigcard{display:flex;flex-wrap:wrap;background:var(--card);padding:18px;border-radius:6px;box-shadow:0 2px 0 #E2D9CA,0 30px 50px rgba(42,36,32,.16);transform:rotate(-.6deg)}
.bigcard .front{flex:1 1 360px;aspect-ratio:4/3;position:relative;background:#C9B29B;overflow:hidden;border-radius:3px}
.bigcard .back{flex:1 1 360px;margin:0;padding:18px 6px 6px 26px;display:flex;flex-direction:column;gap:16px;color:var(--ink)}
.bigcard .stamp{position:static}.bigcard .stamp div{width:96px;height:110px;font-size:44px}
.postmark{width:116px;height:116px;border:2px solid var(--brown);border-radius:50%;opacity:.8;transform:rotate(-12deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--brown)}
.postmark b{font:600 10px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.postmark span{font:400 22px/1.1 'Instrument Serif',serif}
.note{margin:0;font:500 27px/1.3 Caveat,cursive}
.lines div{border-bottom:1px solid var(--line);padding:4px 0;font:500 23px Caveat,cursive}
.lines b{font:600 11px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);margin-right:10px}
.box{background:var(--card);border:1px solid #E2D9CA;border-radius:16px;padding:22px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:5px 0}
.cols{display:flex;flex-wrap:wrap;gap:40px;padding:48px 0}
.cols>*{flex:1 1 300px}.cols>.wide{flex:2 1 440px}
.prose p{margin:0 0 14px;font-size:17px;line-height:1.75;white-space:pre-line}
/* ticket */
.ticket{display:flex;background:var(--wine);color:#F4EFE6;border-radius:12px;overflow:hidden;box-shadow:0 16px 28px rgba(42,36,32,.14)}
.ticket .main{flex:1;padding:22px;min-width:0}
.ticket .stub{flex:0 0 84px;border-left:2px dashed #B98585;background:var(--wine2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ticket .k{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--blush)}
.ticket .score{font:400 40px/1 'Instrument Serif',serif}
.bigticket{flex-wrap:wrap}.bigticket .main{flex:3 1 420px;padding:32px;display:flex;flex-wrap:wrap;gap:28px}
.bigticket .stub{flex:1 1 200px;padding:32px 20px;gap:8px}.bigticket .score{font-size:72px}
.poster{flex:0 0 150px;aspect-ratio:2/3;background:#5E2626;border:1px solid #A76A6A;border-radius:4px;overflow:hidden}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
.facts small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blush)}
/* photos */
.polaroid{background:var(--card);padding:14px 14px 58px;box-shadow:0 30px 50px rgba(42,36,32,.16);transform:rotate(-1deg);position:relative}
.polaroid .pic{aspect-ratio:4/3;background:#A9B7C4;overflow:hidden}
.polaroid .hand{position:absolute;left:18px;right:18px;bottom:12px;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.film{background:#2A2420;border-radius:6px;padding:12px 14px;margin-top:20px}
.holes{height:10px;background:repeating-linear-gradient(90deg,#F4EFE6 0 14px,transparent 14px 28px);opacity:.85;border-radius:2px;margin:2px 0 12px}
.holes.b{margin:12px 0 2px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.frame .pic{aspect-ratio:1;background:#D8C7B2;overflow:hidden}
.frame .meta{display:flex;justify-content:space-between;padding:7px 2px 0;font-size:11px;letter-spacing:.1em;color:var(--gold)}
.frame .hand{color:#F4EFE6;font-size:19px;padding:0 2px 4px;line-height:1.2}
.potd{display:flex;flex-wrap:wrap;gap:36px;align-items:center;padding:clamp(22px,4vw,36px);background:#2A2420;color:#F4EFE6;border-radius:20px;margin-top:56px}
.potd .polaroid{flex:0 1 320px;color:var(--ink)}
.potd>div:last-child{flex:1 1 280px}
/* day */
.daycard{display:flex;flex-direction:column;justify-content:space-between;gap:18px;background:var(--blush);border-radius:16px;padding:26px;min-height:260px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:32px 0}
.strip div{background:var(--card);padding:14px 18px}
.strip small{display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:24px}
.two .pic{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#D8C7B2}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:14px}
.pager a{padding:10px 0}
footer.bottom{margin-top:72px;padding-top:28px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:baseline}
footer.bottom p{margin:0;max-width:420px;font-size:14px;color:var(--soft)}
.tilt-l{transform:rotate(-1deg)}.tilt-r{transform:rotate(.8deg)}
@media(prefers-reduced-motion:no-preference){.grid>a{transition:transform .2s}.grid>a:hover{transform:translateY(-3px) rotate(0)}}
@media(max-width:600px){.hero{padding:40px 0 28px}.bigcard,.polaroid{transform:none}.bigcard .back{padding:18px 4px 4px}.feature .cover{flex-basis:150px}}
</style>
<!-- View counts (GoatCounter): privacy-friendly, no cookies, no personal data -->
<script>window.goatcounter = {no_onload: true};</script>
<script data-goatcounter="https://postcardfrommai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
<header class="top">
<a class="logo" href="#home">Postcards from Mai</a>
<nav class="menu" aria-label="Sections">
<a href="#books">Books</a><a href="#coffee">Coffee</a><a href="#watched">Watched</a><a href="#photos">Photos</a><a href="#days">Days</a><a href="#about">About</a>
</nav>
</header>
<main id="view" aria-live="polite"><p class="muted" style="padding:80px 0;text-align:center">Opening the notebook…</p></main>
<footer class="bottom">
<div class="serif it" style="font-size:34px">Books · Coffee · Screens · Photos · Days</div>
<p>A public little notebook, updated whenever something is worth writing down. All words and photos © Mai. Please ask before using them.</p>
</footer>
</div>
<script>
{
const view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src = p => (typeof p === 'string' && /^(media|photos)\/[A-Za-z0-9._-]+$/.test(p)) ? p : '';
const pic = (p, alt) => src(p) ? `<img src="${src(p)}" alt="${esc(alt)}" loading="lazy">` : '';
const day = d => { const t = new Date(String(d) + 'T12:00:00'); return isNaN(t) ? '' : t.toLocaleDateString('en-GB', {day:'numeric', month:'short'}); };
const full = d => { const t = new Date(String(d) + 'T12:00:00'); return isNaN(t) ? '' : t.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); };
const wk = d => { const t = new Date(String(d) + 'T12:00:00'); return isNaN(t) ? '' : t.toLocaleDateString('en-GB', {weekday:'long'}); };
const clamp = (n, max) => Math.max(0, Math.min(max, Math.round(Number(n) || 0)));
const stars = n => { n = clamp(n, 5); return `<span class="stars" aria-label="${n} out of 5 stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>`; };
const dots = n => { n = clamp(n, 5); return `<span class="stars" aria-label="${n} out of 5">${'●'.repeat(n)}<span class="off">${'●'.repeat(5 - n)}</span></span>`; };
const tones = ['#A9B59A','#C9B29B','#D9B8A8','#B7A893','#A9B7C4','#D8C7B2'];
const tone = s => tones[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % tones.length];
const paras = t => String(t || '').split(/\n\s*\n/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
const short = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t; };
const empty = (line, sub) => `<div class="empty"><div class="hand">${esc(line)}</div><p style="margin:6px 0 0">${esc(sub)}</p></div>`;
const tags = list => (Array.isArray(list) ? list : []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
const back = (href, label) => `<a class="back" href="#${href}">← ${esc(label)}</a>`;

let all = [], about = {}, rollTag = '';
const byDate = (a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.time || '').localeCompare(String(a.time || ''));
const of = t => all.filter(e => e.type === t).sort(byDate);
const link = e => `#e-${esc(e.id)}`;

/* ---------- cards ---------- */
const coverEl = (e, extra = '') => `<div class="cover" style="--tone:${tone(e.title)};${extra}">${src(e.cover) ? pic(e.cover, 'Cover of ' + e.title) : `<span>${esc(e.title)}</span>`}</div>`;
const bookCard = e => `<a class="bookcard" href="${link(e)}">${coverEl(e)}<div><div class="eyebrow">Book · ${esc(day(e.finished || e.date))}</div><div class="card-title">${esc(e.title)}</div><div class="muted" style="font-size:14px">${esc(e.author)}</div><div style="margin-top:6px">${stars(e.rating)}</div></div></a>`;
const coffeeCard = (e, i = 0) => `<a class="postcard ${i % 2 ? 'tilt-r' : 'tilt-l'}" href="${link(e)}"><div class="front">${pic(e.photo, e.title)}<div class="stamp"><div>${esc(e.rating)}<small>/ 10</small></div></div><div class="greet">Greetings from ${esc(e.title)}</div></div><div style="padding:12px 4px 2px"><div class="eyebrow">Coffee · ${esc(day(e.date))}</div><p>${esc(short(e.note, 110))}</p></div></a>`;
const ticketCard = (e, i = 0) => `<a class="ticket ${i % 2 ? 'tilt-l' : 'tilt-r'}" href="${link(e)}"><div class="main"><div class="k">Admit one · ${esc(e.kind === 'series' ? 'Series' : 'Film')}</div><div class="card-title">${esc(e.title)}</div><div style="font-size:14px;color:var(--blush)">Watched ${esc(day(e.date))}${e.where ? ' · ' + esc(e.where) : ''}</div></div><div class="stub"><div class="score">${clamp(e.rating, 5)}</div><div style="font-size:10px;letter-spacing:.14em;color:var(--blush)">/ 5</div></div></a>`;
const dayCard = e => `<a class="daycard" href="${link(e)}"><div><div class="eyebrow">Day · ${esc(wk(e.date))}</div><div class="card-title it">${esc(e.title)}</div><p style="margin:0;font-size:15px;color:#4A413A">${esc(short(e.text, 140))}</p></div>${e.mood ? `<div class="hand" style="font-size:22px;color:var(--brown)">mood: ${esc(e.mood)}</div>` : ''}</a>`;
const frame = e => `<a class="frame" href="${link(e)}"><div class="pic">${pic(e.photo, e.caption || e.title || 'Photo')}</div><div class="meta"><span>${esc(day(e.date))}</span><span>${esc(e.time)}</span></div><div class="hand">${esc(e.caption)}</div></a>`;
const card = (e, i) => ({book: bookCard, coffee: coffeeCard, watched: ticketCard, day: dayCard, photo: frame}[e.type] || (() => ''))(e, i);

const potdBand = p => `<a class="potd" href="${link(p)}"><div class="polaroid"><div class="pic">${pic(p.photo, p.caption || 'Photo of the day')}</div><div class="hand">${esc(p.caption)}</div></div><div><div class="eyebrow" style="color:var(--gold)">Photo of the day · ${esc(day(p.date))}</div><div class="serif" style="font-size:clamp(34px,5vw,44px);line-height:1;margin:10px 0 14px">${esc(p.title || p.caption)}</div><div style="font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:4px">See the whole camera roll</div></div></a>`;

/* ---------- views ---------- */
function home() {
  const latest = all.filter(e => e.type !== 'photo').sort(byDate);
  const potd = of('photo')[0];
  const top = latest[0];
  const feature = top && top.type === 'book'
    ? `<a class="feature" href="${link(top)}">${coverEl(top)}<div><div class="eyebrow">Book · Finished ${esc(day(top.finished || top.date))}</div><div class="serif" style="font-size:clamp(36px,5vw,48px);line-height:1;margin:10px 0 12px">${esc(top.title)}</div><div style="font-size:22px">${stars(top.rating)}</div><p style="margin:14px 0 0;color:#4A413A">${esc(short(top.review, 220))}</p></div></a>`
    : '';
  const rest = feature ? latest.slice(1, 10) : latest.slice(0, 9);
  return `<section class="hero"><div class="hand">little postcards from ordinary days</div><h1>Books, coffee &amp;<br><span class="it">small days</span></h1><p class="lead">A postcard a day keeps the burnout away.</p></section>
  <div class="chips"><a class="chip" href="#books">Books</a><a class="chip" href="#coffee">Coffee shops</a><a class="chip" href="#watched">Watched</a><a class="chip" href="#photos">Photos</a><a class="chip" href="#days">Days</a></div>
  ${latest.length ? feature + `<div class="grid">${rest.map(card).join('')}</div>` : empty('The first postcard is on its way.', 'Books, cafés, films and small days will show up here.')}
  ${potd ? potdBand(potd) : ''}`;
}

function section(t) {
  const meta = {
    books: ['what I’ve been reading', 'The <span class="it">bookshelf</span>', 'book', 'No books yet.', 'The first review is coming soon.'],
    coffee: ['wish you were here', 'Coffee <span class="it">postcards</span>', 'coffee', 'No postcards yet.', 'The first café is coming soon.'],
    watched: ['kept the ticket', 'The <span class="it">ticket box</span>', 'watched', 'No tickets yet.', 'Films and series will show up here.'],
    days: ['nothing big, just days', 'Small <span class="it">days</span>', 'day', 'No days written yet.', 'The first little note is coming soon.']
  }[t];
  const list = of(meta[2]);
  return `<section class="hero"><div class="hand">${meta[0]}</div><h1>${meta[1]}</h1></section>${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : empty(meta[3], meta[4])}`;
}

function photos() {
  const list = of('photo');
  if (!list.length) return `<section class="hero"><div class="hand">things I stopped to look at</div><h1>The <span class="it">camera roll</span></h1></section>${empty('No photos yet.', 'Skies, coffee cups and little things will show up here.')}`;
  const p = list[0];
  const allTags = [...new Set(list.flatMap(e => Array.isArray(e.tags) ? e.tags : []))];
  const shown = rollTag ? list.filter(e => (e.tags || []).includes(rollTag)) : list;
  return `<section class="hero"><div class="hand">things I stopped to look at</div><h1>The <span class="it">camera roll</span></h1></section>
  <section style="display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding-bottom:56px">
    <a class="polaroid" href="${link(p)}" style="flex:3 1 400px"><div class="pic">${pic(p.photo, p.caption || 'Photo of the day')}</div><div class="hand">${esc(p.caption)}</div></a>
    <div style="flex:2 1 260px"><div class="eyebrow">Photo of the day · ${esc(day(p.date))}</div><div class="serif" style="font-size:clamp(36px,5vw,48px);line-height:1;margin:10px 0 14px">${esc(p.title || p.caption)}</div>${p.note ? `<p class="muted">${esc(p.note)}</p>` : ''}<div>${tags(p.tags)}</div></div>
  </section>
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding-top:28px;border-top:1px solid var(--line)"><h2 style="margin:0">The roll</h2>
  <div class="chips" style="padding:0;justify-content:flex-end"><button class="chip${rollTag ? '' : ' on'}" data-tag="">All</button>${allTags.map(t => `<button class="chip${rollTag === t ? ' on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
  <div class="film"><div class="holes" aria-hidden="true"></div><div class="frames">${shown.map(frame).join('')}</div><div class="holes b" aria-hidden="true"></div></div>`;
}

function bookPage(e) {
  const facts = [['Genre', e.genre], ['Started', day(e.started)], ['Finished', day(e.finished)], ['Pages', e.pages], ['Read as', e.format]].filter(f => f[1]);
  return `${back('books', 'All books')}
  <section style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-end;padding:24px 0 40px">${coverEl(e, 'flex:0 0 min(240px,60vw)')}
  <div style="flex:1 1 380px">${e.tagline ? `<div class="hand" style="font-size:26px;color:var(--brown)">${esc(e.tagline)}</div>` : ''}<h1 style="font-size:clamp(44px,7vw,80px)">${esc(e.title)}</h1><div style="font-size:18px;color:#4A413A">${esc(e.author)}</div><div style="font-size:28px;margin-top:14px">${stars(e.rating)}</div></div></section>
  ${facts.length ? `<div class="strip" style="margin:0">${facts.map(f => `<div><small class="eyebrow">${esc(f[0])}</small><span>${esc(f[1])}</span></div>`).join('')}</div>` : ''}
  <div class="cols">${e.summary ? `<div><h2>In short</h2><p class="muted" style="margin:0;line-height:1.7">${esc(e.summary)}</p></div>` : ''}<div class="wide prose"><h2>What I thought</h2>${paras(e.review)}</div></div>
  ${e.quote ? `<blockquote style="margin:0;padding:44px 32px;background:var(--blush);border-radius:20px;text-align:center"><div class="eyebrow">Favourite line</div><p class="serif it" style="margin:14px auto 0;max-width:680px;font-size:clamp(24px,3.4vw,36px);line-height:1.25">“${esc(e.quote)}”</p></blockquote>` : ''}
  ${(e.photos || []).length ? `<h2 style="margin-top:48px">The vibe</h2><div class="two">${e.photos.map(p => `<div class="pic">${pic(p, 'Reading ' + e.title)}</div>`).join('')}</div>` : ''}`;
}

function coffeePage(e) {
  const s = e.scores || {};
  const rows = [['Coffee', s.coffee], ['Vibe', s.vibe], ['Seating', s.seating], ['Good for reading', s.reading], ['Wi-Fi', s.wifi]].filter(r => r[1] != null);
  const lines = [['Ordered', e.ordered], ['Spent', e.spent], ['With', e.with]].filter(l => l[1]);
  return `${back('coffee', 'All postcards')}
  <div class="hero" style="padding:16px 0 32px"><div class="hand">a postcard from</div><h1 style="font-size:clamp(44px,8vw,88px)">${esc(e.title)}</h1></div>
  <div class="bigcard"><div class="front">${pic(e.photo, e.title)}${e.area ? `<div class="greet" style="font-size:32px;right:16px">Greetings from ${esc(e.area)}</div>` : ''}</div>
  <div class="back"><div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start"><div class="postmark"><b>Visited</b><span>${esc(day(e.date))}</span><b>${esc(e.city || '')}</b></div><div class="stamp"><div>${esc(e.rating)}<small>OUT OF 10</small></div></div></div>
  <p class="note">${esc(e.note)}</p><div class="lines" style="margin-top:auto">${lines.map(l => `<div><b>${esc(l[0])}</b>${esc(l[1])}</div>`).join('')}</div><div class="hand" style="text-align:right;font-size:28px;color:var(--brown)">— Mai</div></div></div>
  <div class="cols">${rows.length ? `<div class="box"><div class="eyebrow" style="margin-bottom:8px">The little scores</div>${rows.map(r => `<div class="row"><span>${esc(r[0])}</span>${dots(r[1])}</div>`).join('')}</div>` : ''}
  <div>${(e.tags || []).length ? `<div class="eyebrow" style="margin-bottom:12px">Good for</div>${tags(e.tags)}` : ''}${(e.photos || []).length ? `<div class="two">${e.photos.map(p => `<div class="pic">${pic(p, e.title)}</div>`).join('')}</div>` : ''}</div></div>`;
}

function watchedPage(e) {
  const facts = [['Type', e.kind === 'series' ? 'Series' + (e.season ? ' · ' + e.season : '') : 'Film'], ['Watched', day(e.date)], ['Where', e.where], ['Progress', e.progress]].filter(f => f[1]);
  return `${back('watched', 'Everything I’ve watched')}
  <div class="hero" style="padding:16px 0 32px"><div class="hand" style="color:var(--wine)">kept the ticket</div><h1 style="font-size:clamp(44px,8vw,88px)">${esc(e.title)}</h1></div>
  <div class="ticket bigticket"><div class="main"><div class="poster">${pic(e.poster, 'Poster for ' + e.title)}</div><div style="flex:1 1 220px;display:flex;flex-direction:column;gap:14px"><div class="k">Admit one</div><div class="serif" style="font-size:38px;line-height:1">${esc(e.title)}</div><div class="facts" style="margin-top:auto">${facts.map(f => `<div><small>${esc(f[0])}</small>${esc(f[1])}</div>`).join('')}</div></div></div>
  <div class="stub"><div class="k" style="font-size:10px">My rating</div><div class="score">${clamp(e.rating, 5)}<span style="font-size:26px;color:var(--blush)">/5</span></div>${e.verdict ? `<div class="hand" style="font-size:24px">${esc(e.verdict)}</div>` : ''}</div></div>
  <div class="cols"><div class="wide prose"><h2>What I thought</h2>${paras(e.review)}</div>
  <div style="display:flex;flex-direction:column;gap:14px">${e.likeIf ? `<div class="box"><div class="eyebrow" style="color:var(--wine)">Watch it if you like</div><div style="margin-top:8px">${esc(e.likeIf)}</div></div>` : ''}${e.snack ? `<div class="box"><div class="eyebrow" style="color:var(--wine)">Snack of choice</div><div class="hand" style="font-size:24px;margin-top:4px">${esc(e.snack)}</div></div>` : ''}</div></div>`;
}

function photoPage(e) {
  return `${back('photos', 'The camera roll')}
  <section style="display:flex;flex-wrap:wrap;gap:40px;align-items:center;padding:24px 0"><div class="polaroid" style="flex:3 1 420px"><div class="pic" style="aspect-ratio:auto">${pic(e.photo, e.caption || e.title || 'Photo')}</div><div class="hand">${esc(e.caption)}</div></div>
  <div style="flex:2 1 260px"><div class="eyebrow">${esc(full(e.date))}${e.time ? ' · ' + esc(e.time) : ''}</div><div class="serif" style="font-size:clamp(36px,5vw,48px);line-height:1;margin:10px 0 14px">${esc(e.title || e.caption)}</div>${e.note ? `<p class="muted">${esc(e.note)}</p>` : ''}<div>${tags(e.tags)}</div></div></section>`;
}

function dayPage(e) {
  const list = of('day'); const i = list.findIndex(x => x.id === e.id);
  const newer = list[i - 1], older = list[i + 1];
  const facts = [['Mood', e.mood], ['Reading', e.reading], ['On repeat', e.onRepeat], ['Ate', e.ate]].filter(f => f[1]);
  return `${back('days', 'All days')}<article style="max-width:680px;margin:0 auto;padding-top:24px">
  <div style="text-align:center"><div class="eyebrow">${esc(full(e.date))}</div><h1 class="it" style="font-size:clamp(48px,9vw,92px);margin-top:12px">${esc(e.title)}</h1></div>
  ${facts.length ? `<div class="strip">${facts.map(f => `<div><small class="eyebrow">${esc(f[0])}</small><span>${esc(f[1])}</span></div>`).join('')}</div>` : ''}
  <div class="prose">${paras(e.text)}</div>
  ${(e.photos || []).length ? `<div class="two">${e.photos.map(p => `<div class="pic">${pic(p, e.title)}</div>`).join('')}</div>` : ''}
  <div class="pager">${older ? `<a href="${link(older)}">← ${esc(wk(older.date))}</a>` : '<span></span>'}${newer ? `<a href="${link(newer)}">${esc(wk(newer.date))} →</a>` : '<span></span>'}</div></article>`;
}

function aboutPage() {
  const a = about || {};
  const now = [['Reading', a.reading], ['Drinking', a.drinking], ['Watching', a.watching], ['Listening to', a.listening]].filter(f => f[1]);
  const sections = [['books', 'Books', 'what I read, with stars'], ['coffee', 'Coffee', 'cafés, sent as postcards'], ['watched', 'Watched', 'films and series, kept as tickets'], ['photos', 'Photos', 'little things I stopped to look at'], ['days', 'Days', 'small notes from ordinary days']];
  return `<section style="display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding:56px 0 40px">
  ${src(a.photo) ? `<div class="polaroid" style="flex:0 1 300px"><div class="pic" style="aspect-ratio:4/5">${pic(a.photo, 'A photo from Mai')}</div><div class="hand">${esc(a.caption || 'hi, it’s me')}</div>${a.credit ? `<div style="position:absolute;left:18px;right:18px;bottom:-26px;font-size:12px;color:var(--soft)">${esc(a.credit)}</div>` : ''}</div>` : ''}
  <div style="flex:1 1 360px"><div class="hand" style="font-size:28px;color:var(--brown)">hello,</div><h1 style="font-size:clamp(44px,7vw,80px)">${esc(a.heading || 'I’m Mai')}</h1><div class="prose">${paras(a.text)}</div></div></section>
  ${now.length ? `<h2>Currently</h2><div class="strip" style="margin-top:0">${now.map(f => `<div><small class="eyebrow">${esc(f[0])}</small><span>${esc(f[1])}</span></div>`).join('')}</div>` : ''}
  <h2 style="margin-top:40px">What you’ll find here</h2>
  <div class="grid" style="gap:14px">${sections.map(x => `<a class="box" href="#${x[0]}"><div class="serif" style="font-size:28px;line-height:1.1">${x[1]}</div><div class="muted" style="font-size:15px;margin-top:4px">${x[2]}</div></a>`).join('')}</div>
  <p class="hand" style="font-size:24px;color:var(--brown);text-align:center;margin:48px 0 0">a postcard a day keeps the burnout away</p>`;
}

/* ---------- routing ---------- */
const navKey = {book: 'books', coffee: 'coffee', watched: 'watched', photo: 'photos', day: 'days'};
function route() {
  const h = location.hash.slice(1);
  let html, active = '';
  if (h.startsWith('e-')) {
    const e = all.find(x => x.id === h.slice(2));
    if (e) { active = navKey[e.type]; html = ({book: bookPage, coffee: coffeePage, watched: watchedPage, photo: photoPage, day: dayPage}[e.type] || home)(e); }
  } else if (['books', 'coffee', 'watched', 'days'].includes(h)) { active = h; html = section(h); }
  else if (h === 'photos') { active = h; html = photos(); }
  else if (h === 'about') { active = h; html = aboutPage(); }
  view.innerHTML = html || home();
  document.querySelectorAll('nav.menu a').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + active));
}
function track() {
  const h = location.hash.slice(1) || 'home';
  const e = h.startsWith('e-') ? all.find(x => x.id === h.slice(2)) : null;
  const names = {home: 'Home', books: 'Books', coffee: 'Coffee', watched: 'Watched', photos: 'Photos', days: 'Days', about: 'About'};
  const title = e ? (e.title || e.caption || 'Entry') : (names[h] || 'Home');
  document.title = title === 'Home' ? 'Postcards from Mai' : title + ' · Postcards from Mai';
  let tries = 0;
  const send = () => {
    const gc = window.goatcounter;
    if (gc && typeof gc.count === 'function') { try { gc.count({path: '/' + h, title}); } catch (err) {} }
    else if (tries++ < 20) setTimeout(send, 500);
  };
  send();
}
view.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-tag]');
  if (b) { rollTag = b.dataset.tag; route(); }
});
window.addEventListener('hashchange', () => { rollTag = ''; route(); window.scrollTo(0, 0); track(); });

fetch('entries.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { about = (d.about && typeof d.about === 'object') ? d.about : {}; all = (Array.isArray(d.entries) ? d.entries : []).filter(e => e && typeof e === 'object' && /^[a-z0-9-]+$/.test(e.id || '')); route(); track(); })
  .catch(() => { view.innerHTML = empty('The notebook didn’t open.', 'Please refresh the page in a moment.'); });
}
</script>
</body>
</html>
